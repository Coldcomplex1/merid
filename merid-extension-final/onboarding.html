<!doctype html>
<!--
  The first-run wizard as a page of its own. background.js opens this on
  install, because the tab sitting there at that moment is the Web Store or a
  new tab and neither runs a content script - so there is nothing to put an
  overlay over.

  The wizard is the whole of this page, so it uses the same overlay in
  standalone mode: no backdrop to click off, and closing means closing the tab.

  Two things this page does that the content-script path cannot:

    - Registers Outfit and Inter. @font-face cannot be declared inside a shadow
      root; only a document can do it. Declared here, the shadow root picks
      them up, and over a page the same CSS falls through to the system stack.
    - Loads lib/vocab-core.js, which over a page is already there as the first
      content script. The wizard reads DATASET_REGISTRY and DEFAULT_SETTINGS
      from it rather than restating either.

  No inline script: extension pages run under script-src 'self', which refuses
  one. onboarding.js starts itself here instead - see the bootstrap at its foot.
-->
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Merid</title>
    <style>
        /* Self-hosted woff2, same files the popup uses - no remote requests,
           CSP-safe, works offline. */
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url('fonts/Outfit-latin.woff2') format('woff2');
        }

        /* The range matters as much as the file. Declared without one, a face
           claims every codepoint there is, wins the match for "ệ", finds no
           glyph and drops straight to the system font - it never tries the
           sibling face below that actually has it. Saying what this file covers
           is what lets the Vietnamese one cover the rest. */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400 600;
            font-display: swap;
            src: url('fonts/Inter-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
                U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC,
                U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        /* The bundled Inter and Outfit are both LATIN subsets: they carry "a"
           and "à" but not "ạ ệ ơ đ ữ", so Vietnamese words came out half in the
           web font and half in whatever the system fell back to, changing shape
           mid-word. This subset carries the missing block. The unicode-range
           keeps it out of the way of everything else, so it is only fetched
           when there is Vietnamese on screen, which here there always is. */
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400 600;
            font-display: swap;
            src: url('fonts/Inter-vietnamese.woff2') format('woff2');
            unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169,
                U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309,
                U+0323, U+0329, U+1EA0-1EF9, U+20AB;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: #ece7dc;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <script src="lib/vocab-core.js"></script>
    <script src="onboarding.js"></script>
</body>

</html>
